name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Luis Dharna
        run: pnpm --filter @workspace/luis-dharna run build

      - name: Show build output
        run: |
          echo "Buscando archivos generados..."
          find . -type f -name "index.html" -not -path "./node_modules/*"
          echo "Directorios dist:"
          find . -type d -name "dist" -not -path "./node_modules/*"

      - name: Prepare Pages
        run: |
          rm -rf ./pages
          mkdir -p ./pages

          DIST=$(find . -type d -path "*/dist" -not -path "./node_modules/*" | head -n 1)

          if [ -z "$DIST" ]; then
            echo "ERROR: No se encontró ningún directorio dist."
            exit 1
          fi

          echo "Usando build: $DIST"
          cp -R "$DIST"/. ./pages/

          echo "Contenido de Pages:"
          find ./pages -maxdepth 2 -type f

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
